[workspace]
resolver = "3"
members = [
  "crates/occt-shim",
  "crates/kernel",
  "crates/core",
  "crates/render",
  "crates/app",
  "crates/cli",
  "crates/import",
  "crates/testmodels",
]


[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/SilasVogt/newtopo"
rust-version = "1.88"

[workspace.dependencies]
newtopo-occt-shim = { path = "crates/occt-shim" }
newtopo-kernel = { path = "crates/kernel" }
newtopo-core = { path = "crates/core" }
newtopo-render = { path = "crates/render" }
newtopo-testmodels = { path = "crates/testmodels" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
glam = { version = "0.34", features = ["serde", "bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
robust = "1.2"
spade = "2.15"
imbl = { version = "7", features = ["serde"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
cxx = "1.0"
cxx-build = "1.0"
wgpu = "30"
pollster = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland", "accesskit"] }
egui = "0.36"
egui-wgpu = "0.36"
egui_dock = "0.21"
rfd = "0.15"
directories = "6"
log = "0.4"
env_logger = "0.11"
proptest = "1"
insta = { version = "1", features = ["json"] }
criterion = "0.8"
tempfile = "3"
# Update check only: HTTPS to the GitHub API (rustls + webpki roots, no
# native TLS), and opening the release page in the browser.
ureq = { version = "3", default-features = false, features = ["rustls"] }
open = "5"
# Problem reports: OS version, CPU and memory for "PC details" (no host or
# user names are read).
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
