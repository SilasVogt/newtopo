name: Linux build dependencies
description: >
  System packages eframe/winit/wgpu and the C++ shim need to build on
  Ubuntu (headers for X11, Wayland and xkbcommon; pkg-config).
inputs:
  extra:
    description: Additional apt packages
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        sudo apt-get update -qq
        # libgtk-3-dev is not needed while rfd uses the xdg-portal backend
        # (the default); add it here if rfd's gtk3 feature is ever enabled.
        sudo apt-get install -y -qq --no-install-recommends \
          pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
          libxrandr-dev libxi-dev libgl1-mesa-dev ${{ inputs.extra }}
