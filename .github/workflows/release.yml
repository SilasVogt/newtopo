name: Release

# Tag push (v*): build every package and attach them to a *draft* GitHub
# Release for review. Manual run (workflow_dispatch): build everything and
# upload it as workflow artifacts only (dry run, no Release).
on:
  push:
    tags: ["v*"]
    branches: [wip/ship] # TEMP: exercise packaging before merge; remove at merge
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  linux:
    name: Linux x86-64 (tar.gz, AppImage, deb)
    # Oldest supported Ubuntu image: binaries need glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
        with:
          extra: patchelf dpkg-dev desktop-file-utils
      - uses: ./.github/actions/occt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --workspace --release --locked
      - name: Package
        run: |
          desktop-file-validate packaging/linux/newtopo.desktop
          packaging/linux/package.sh --skip-build --out dist
      # The Rust binaries don't link OCCT until the shim lands, so package a
      # small OCCT-linked probe as newtopo-import to test the .so bundling.
      - name: Packaging self-test (OCCT-linked probe)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          cfg="$(dirname "$(find "$OCCT_DIR" -name OpenCASCADEConfig.cmake | head -1)")"
          cmake -S packaging/selftest -B build-probe -DCMAKE_BUILD_TYPE=Release -DOpenCASCADE_DIR="$cfg"
          cmake --build build-probe --parallel
          mkdir -p probe-bin
          cp target/release/newtopo target/release/newtopo-cli build-probe/newtopo-import probe-bin/
          packaging/linux/package.sh --bin-dir probe-bin --out probe-dist
          mkdir probe-x && tar -xzf probe-dist/*.tar.gz -C probe-x
          env -u LD_LIBRARY_PATH probe-x/*/bin/newtopo-import | grep occt-probe-ok
          env -u LD_LIBRARY_PATH ldd probe-x/*/bin/newtopo-import
          chmod +x probe-dist/*.AppImage
          (cd probe-x && APPIMAGE_EXTRACT_AND_RUN=1 ../probe-dist/*.AppImage --appimage-extract >/dev/null)
          env -u LD_LIBRARY_PATH probe-x/squashfs-root/usr/bin/newtopo-import | grep occt-probe-ok
          dpkg-deb -c probe-dist/*.deb | grep -c 'opt/newtopo/lib/libTK'
          dpkg-deb -f probe-dist/*.deb Depends
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64 (installer, zip)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/occt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --workspace --release --locked
      - name: Package
        shell: pwsh
        run: packaging/windows/package.ps1 -SkipBuild -Out dist
      - name: Packaging self-test (OCCT-linked probe)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: pwsh
        run: |
          $cfg = (Get-ChildItem $env:OCCT_DIR -Recurse -Filter OpenCASCADEConfig.cmake | Select-Object -First 1).DirectoryName
          cmake -S packaging/selftest -B build-probe -A x64 "-DOpenCASCADE_DIR=$cfg"
          if ($LASTEXITCODE) { throw "configure failed" }
          cmake --build build-probe --config Release --parallel
          if ($LASTEXITCODE) { throw "build failed" }
          New-Item -ItemType Directory probe-bin | Out-Null
          Copy-Item target/release/newtopo.exe, target/release/newtopo-cli.exe, build-probe/Release/newtopo-import.exe probe-bin
          packaging/windows/package.ps1 -BinDir probe-bin -Out probe-dist
          Expand-Archive (Get-ChildItem probe-dist/*.zip).FullName probe-x
          $exe = (Get-ChildItem probe-x -Recurse -Filter newtopo-import.exe).FullName
          Get-ChildItem (Split-Path $exe) | Format-Table Name, Length
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $out = & $exe
          Write-Host $out
          if ("$out" -notmatch 'occt-probe-ok') { throw "probe did not run from the zip (exit $LASTEXITCODE)" }
          # Silent install, run from the install dir, silent uninstall.
          $setup = (Get-ChildItem probe-dist/*-setup.exe).FullName
          Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', '/DIR=C:\probe-install', '/LOG=probe-install.log' -Wait
          $out = & C:\probe-install\newtopo-import.exe
          if ("$out" -notmatch 'occt-probe-ok') { Get-Content probe-install.log; throw "probe did not run after install" }
          Write-Host "HKCU .ntopo -> $((Get-ItemProperty 'HKCU:\Software\Classes\.ntopo').'(default)')"
          Start-Process C:\probe-install\unins000.exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          if (Test-Path C:\probe-install\newtopo.exe) { throw "uninstall left newtopo.exe behind" }
      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS arm64 (app, dmg)
    runs-on: macos-15
    env:
      # Room for install_name_tool to rewrite load commands.
      RUSTFLAGS: -C link-arg=-Wl,-headerpad_max_install_names
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/occt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --workspace --release --locked
      - name: Package
        run: packaging/macos/package.sh --skip-build --out dist
      - name: Packaging self-test (OCCT-linked probe)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          unset DYLD_FALLBACK_LIBRARY_PATH DYLD_LIBRARY_PATH
          cfg="$(dirname "$(find "$OCCT_DIR" -name OpenCASCADEConfig.cmake | head -1)")"
          cmake -S packaging/selftest -B build-probe -DCMAKE_BUILD_TYPE=Release -DOpenCASCADE_DIR="$cfg" \
            -DCMAKE_EXE_LINKER_FLAGS=-Wl,-headerpad_max_install_names
          cmake --build build-probe --parallel
          echo "--- probe as built:"; otool -L build-probe/newtopo-import
          mkdir -p probe-bin
          cp target/release/newtopo target/release/newtopo-cli build-probe/newtopo-import probe-bin/
          packaging/macos/package.sh --bin-dir probe-bin --out probe-dist
          hdiutil attach probe-dist/*.dmg -mountpoint /tmp/probe -nobrowse -readonly
          ls /tmp/probe /tmp/probe/newtopo.app/Contents/Frameworks | head -40
          /tmp/probe/newtopo.app/Contents/MacOS/newtopo-import | grep occt-probe-ok
          codesign --verify --deep --strict /tmp/probe/newtopo.app
          hdiutil detach /tmp/probe
      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Checksums and draft release
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * | tee SHA256SUMS.txt
      - name: Check tag, version and licence
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -I packaging/common/meta.py version)"
          [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo version $version"; exit 1; }
          [ -f LICENSE ] || { echo "LICENSE missing at the repo root"; exit 1; }
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          newtopo ${GITHUB_REF_NAME#v}

          | System | Download |
          | --- | --- |
          | Windows 10/11 x64 | \`*-windows-x64-setup.exe\` (installer) or \`*-windows-x64.zip\` (portable) |
          | macOS 11+ (Apple silicon) | \`*-macos-arm64.dmg\` |
          | Linux x86-64 (glibc 2.35+) | \`*.AppImage\`, \`*-linux-amd64.deb\` or \`*-linux-x86_64.tar.gz\` |

          The builds are not code-signed yet. See [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INSTALL.md)
          for the SmartScreen and Gatekeeper steps. Verify downloads against \`SHA256SUMS.txt\`.
          EOF
          gh release create "$GITHUB_REF_NAME" --draft $prerelease \
            --title "newtopo ${GITHUB_REF_NAME#v}" --notes-file notes.md dist/*
      - name: Upload combined artifact (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: newtopo-packages
          path: dist/*
