name: Release

# Tag push (v*): build every package, smoke-test it and attach it to a
# *draft* GitHub Release for review. Manual runs (workflow_dispatch) and pull
# requests that touch packaging: the same builds and smoke tests, uploaded as
# workflow artifacts only (dry run, no Release).
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
      - ".github/actions/**"
      - "scripts/build-occt.*"
      - "rust-toolchain.toml"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  linux:
    name: Linux x86-64 (tar.gz, AppImage, deb)
    # Oldest supported Ubuntu image: binaries need glibc >= 2.35.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
        with:
          # libfuse2: run the AppImage mounted; mesa-vulkan-drivers: lavapipe for the GUI smoke test.
          extra: patchelf dpkg-dev desktop-file-utils libfuse2 mesa-vulkan-drivers libvulkan1
      - uses: ./.github/actions/occt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0  # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --workspace --release --locked
      - name: Package
        run: |
          desktop-file-validate packaging/linux/newtopo.desktop
          packaging/linux/package.sh --skip-build --out dist
      - name: Reference models
        run: |
          cargo build -p newtopo-testmodels --features occt --release --locked
          target/release/newtopo-testmodels models/
      # Every Linux format, run as shipped: no LD_LIBRARY_PATH, packages
      # unpacked outside the workspace so nothing from target/ is found.
      - name: Smoke test packages
        run: |
          T="$RUNNER_TEMP/smoke"; mkdir -p "$T"; M="$PWD/models"; S="$PWD/packaging/smoke/smoke.sh"
          name="$(basename dist/*.tar.gz .tar.gz)"
          unset LD_LIBRARY_PATH

          echo "::group::tar.gz"
          tar -xzf dist/*.tar.gz -C "$T"
          ldd "$T/$name/bin/newtopo" "$T/$name/bin/newtopo-cli" "$T/$name/bin/newtopo-import" | grep -E '^/|libTK|not found'
          "$S" cli "$M" "$T/w-tar" "$T/$name/bin/newtopo-cli"
          # lavapipe (software Vulkan) is installed, so the GUI must render.
          NEWTOPO_SMOKE_GPU=1 "$S" gui "$T/w-tar-gui" "$T/$name/bin/newtopo"
          echo "::endgroup::"

          echo "::group::AppImage (extracted, AppRun --cli)"
          cp dist/*.AppImage "$T/newtopo.AppImage"; chmod +x "$T/newtopo.AppImage"
          (cd "$T" && ./newtopo.AppImage --appimage-extract >/dev/null)
          "$S" cli "$M" "$T/w-appdir" "$T/squashfs-root/AppRun" --cli
          echo "::endgroup::"

          echo "::group::AppImage (FUSE mount via a symlink named newtopo-cli)"
          ln -s newtopo.AppImage "$T/newtopo-cli"
          "$S" cli "$M" "$T/w-appimage" "$T/newtopo-cli"
          echo "::endgroup::"

          echo "::group::.deb (apt install, /usr/bin symlinks)"
          sudo apt-get install -y -qq "$PWD/$(ls dist/*.deb)"
          ls -l "$(command -v newtopo-cli)"
          "$S" cli "$M" "$T/w-deb" newtopo-cli
          NEWTOPO_SMOKE_GPU=1 "$S" gui "$T/w-deb-gui" newtopo
          sudo apt-get remove -y -qq newtopo
          [ ! -e /opt/newtopo ] || { echo "/opt/newtopo left behind"; ls -R /opt/newtopo; exit 1; }
          echo "::endgroup::"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x64 (installer, zip)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/occt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0  # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --workspace --release --locked
      - name: Package
        shell: pwsh
        run: packaging/windows/package.ps1 -SkipBuild -Out dist
      - name: Reference models
        run: |
          cargo build -p newtopo-testmodels --features occt --release --locked
          target/release/newtopo-testmodels.exe models
      # Portable zip and a silent per-user install, each run with PATH cut
      # down to the Windows folders (smoke.ps1), then a silent uninstall.
      - name: Smoke test packages
        shell: pwsh
        run: |
          $T = "$env:RUNNER_TEMP\smoke"
          $M = (Resolve-Path models).Path
          # WARP (software DirectX 12) renders the headless GUI shots.
          $env:NEWTOPO_SMOKE_GPU = '1'
          New-Item -ItemType Directory -Force $T | Out-Null

          Write-Host "::group::zip"
          Expand-Archive (Get-ChildItem dist/*.zip).FullName "$T\zip"
          $dir = (Get-ChildItem "$T\zip" -Directory | Select-Object -First 1).FullName
          packaging/smoke/smoke.ps1 -Dir $dir -Models $M -Work "$T\w-zip"
          Write-Host "::endgroup::"

          Write-Host "::group::installer (silent, per user)"
          $setup = (Get-ChildItem dist/*-setup.exe).FullName
          $p = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/CURRENTUSER', "/DIR=$T\install", "/LOG=$T\install.log" -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$T\install.log"; throw "setup exited $($p.ExitCode)" }
          Get-ChildItem "$T\install" | Format-Table Name, Length
          packaging/smoke/smoke.ps1 -Dir "$T\install" -Models $M -Work "$T\w-install"
          $assoc = (Get-ItemProperty 'HKCU:\Software\Classes\.ntopo').'(default)'
          $cmd = (Get-ItemProperty 'HKCU:\Software\Classes\newtopo.scene\shell\open\command').'(default)'
          Write-Host ".ntopo -> $assoc; open: $cmd"
          if ($assoc -ne 'newtopo.scene') { throw ".ntopo association missing" }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter 'newtopo*.lnk'
          if (-not $lnk) { throw "Start-menu shortcut missing" }
          Write-Host "shortcut: $($lnk.FullName)"
          $p = Start-Process "$T\install\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait -PassThru
          if (Test-Path "$T\install\newtopo.exe") { throw "uninstall left newtopo.exe behind" }
          if (Test-Path 'HKCU:\Software\Classes\newtopo.scene') { throw "uninstall left the file association behind" }
          Write-Host "uninstalled (exit $($p.ExitCode))"
          Write-Host "::endgroup::"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS arm64 (app, dmg)
    runs-on: macos-15
    env:
      # Room for install_name_tool to rewrite load commands.
      RUSTFLAGS: -C link-arg=-Wl,-headerpad_max_install_names
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/occt
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0  # keep in sync with rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
      - run: cargo build --workspace --release --locked
      - name: Package
        run: packaging/macos/package.sh --skip-build --out dist
      - name: Reference models
        run: |
          cargo build -p newtopo-testmodels --features occt --release --locked
          target/release/newtopo-testmodels models/
      # The app inside the mounted DMG, as a user would run it: no DYLD_*
      # variables, signature intact, only @rpath and system libraries.
      - name: Smoke test packages
        run: |
          unset DYLD_FALLBACK_LIBRARY_PATH DYLD_LIBRARY_PATH
          T="$RUNNER_TEMP/smoke"; mkdir -p "$T"; M="$PWD/models"; S="$PWD/packaging/smoke/smoke.sh"
          hdiutil attach dist/*.dmg -mountpoint "$T/mnt" -nobrowse -readonly
          app="$T/mnt/newtopo.app"
          ls "$T/mnt" "$app/Contents/MacOS" "$app/Contents/Frameworks"
          codesign --verify --deep --strict --verbose=2 "$app"
          bad=0
          for f in "$app"/Contents/MacOS/* "$app"/Contents/Frameworks/*.dylib; do
            refs="$(otool -L "$f" | tail -n +2 | awk '{print $1}')"
            if echo "$refs" | grep -vE '^(@rpath/|/usr/lib/|/System/)'; then echo "^ unexpected in $f"; bad=1; fi
          done
          for b in newtopo newtopo-cli newtopo-import; do echo "--- otool -L $b"; otool -L "$app/Contents/MacOS/$b"; done
          [ "$bad" = 0 ]
          "$S" cli "$M" "$T/w-dmg" "$app/Contents/MacOS/newtopo-cli"
          # The runners' paravirtual Metal device renders the headless shots.
          NEWTOPO_SMOKE_GPU=1 "$S" gui "$T/w-gui" "$app/Contents/MacOS/newtopo"
          hdiutil detach "$T/mnt"
      - uses: actions/upload-artifact@v7
        with:
          name: packages-macos
          path: dist/*
          if-no-files-found: error

  publish:
    name: Checksums and draft release
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum -- * | tee SHA256SUMS.txt
      - name: Check tag, version and licence
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python3 -I packaging/common/meta.py version)"
          [ "${GITHUB_REF_NAME}" = "v$version" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo version $version"; exit 1; }
          [ -f LICENSE ] || { echo "LICENSE missing at the repo root"; exit 1; }
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          cat > notes.md <<EOF
          newtopo ${GITHUB_REF_NAME#v}

          | System | Download |
          | --- | --- |
          | Windows 10/11 x64 | \`*-windows-x64-setup.exe\` (installer) or \`*-windows-x64.zip\` (portable) |
          | macOS 11+ (Apple silicon) | \`*-macos-arm64.dmg\` |
          | Linux x86-64 (glibc 2.35+) | \`*.AppImage\`, \`*-linux-amd64.deb\` or \`*-linux-x86_64.tar.gz\` |

          The builds are not code-signed yet. See [docs/INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/INSTALL.md)
          for the SmartScreen and Gatekeeper steps. Verify downloads against \`SHA256SUMS.txt\`.
          EOF
          gh release create "$GITHUB_REF_NAME" --draft $prerelease \
            --title "newtopo ${GITHUB_REF_NAME#v}" --notes-file notes.md dist/*
      - name: Upload combined artifact (dry run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: newtopo-packages
          path: dist/*
