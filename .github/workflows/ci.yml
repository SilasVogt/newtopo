name: CI

on:
  pull_request:
  push:
    branches: [main, wip/ship] # TEMP: wip/ship until merged; remove at merge
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"
  MACOSX_DEPLOYMENT_TARGET: "11.0"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/linux-deps
      - uses: ./.github/actions/occt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
        with:
          # Software Vulkan (lavapipe) for headless wgpu tests.
          extra: mesa-vulkan-drivers libvulkan1
      - uses: ./.github/actions/occt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        shell: bash
        run: |
          # macOS: SIP drops DYLD_* when bash starts, so set it again here.
          if [ "$RUNNER_OS" = macOS ]; then export DYLD_FALLBACK_LIBRARY_PATH="$OCCT_DIR/lib"; fi
          cargo test --workspace --locked
