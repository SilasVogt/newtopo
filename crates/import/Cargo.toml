[package]
name = "newtopo-import"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["occt"]
occt = ["newtopo-kernel/occt", "dep:newtopo-occt-shim"]

[dependencies]
newtopo-kernel.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
glam.workspace = true
clap.workspace = true
sha2.workspace = true
# Direct dependency only so build.rs sees DEP_OCCT_SHIM_LIB_DIR (rpath).
newtopo-occt-shim = { workspace = true, optional = true }

[[bin]]
name = "newtopo-import"
path = "src/main.rs"

[dev-dependencies]
newtopo-testmodels = { workspace = true, features = ["occt"] }
tempfile.workspace = true
