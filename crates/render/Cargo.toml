[package]
name = "newtopo-render"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
# Paint-callback integration for the egui viewport (the app enables it; the
# CLI renders headless and does not need egui).
egui = ["dep:egui", "dep:egui-wgpu"]

[dependencies]
newtopo-kernel.workspace = true
newtopo-core.workspace = true
wgpu.workspace = true
glam.workspace = true
bytemuck.workspace = true
pollster.workspace = true
image.workspace = true
anyhow.workspace = true
log.workspace = true
serde.workspace = true
egui = { workspace = true, optional = true }
egui-wgpu = { workspace = true, optional = true }
