[package]
name = "newtopo"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Turn CAD solids into clean, game-ready polygon meshes"

[features]
default = ["occt"]
occt = ["newtopo-kernel/occt", "dep:newtopo-occt-shim"]

[dependencies]
newtopo-kernel.workspace = true
newtopo-core.workspace = true
newtopo-occt-shim = { workspace = true, optional = true }
newtopo-render = { workspace = true, features = ["egui"] }
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui_dock = { workspace = true, features = ["serde"] }
wgpu.workspace = true
rfd.workspace = true
directories.workspace = true
glam.workspace = true
bytemuck.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
image.workspace = true
pollster.workspace = true

# Windows: embed packaging/icons/newtopo.ico as the executable's icon.
[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true

[[bin]]
name = "newtopo"
path = "src/main.rs"
